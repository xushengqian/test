[MRCP]
# MRCP服务器配置
server_ip = 127.0.0.1
server_port = 1544
protocol_version = 2
resource_location = speechrecog

# 连接配置
max_connections = 10
connection_timeout = 30
keepalive_interval = 60

[SIP]
# SIP配置（MRCP v2使用）
sip_port = 5060
transport = udp

[RTP]
# RTP音频流配置
rtp_port_min = 4000
rtp_port_max = 5000
jitter_buffer_size = 100

[ASR]
# 自动语音识别配置
engine = google
language = zh-CN
sample_rate = 16000
channels = 1
encoding = LINEAR16

# 识别参数
start_input_timers = false
no_input_timeout = 5000
recognition_timeout = 10000
speech_complete_timeout = 1000
speech_incomplete_timeout = 2000

# 语法和模型
grammar_type = builtin
confidence_threshold = 0.5

[TTS]
# 文本转语音配置
engine = google
voice = zh-CN-Standard-A
language = zh-CN
sample_rate = 16000
audio_encoding = LINEAR16

# 合成参数
speaking_rate = 1.0
pitch = 0.0
volume_gain_db = 0.0

[AUDIO]
# 音频处理配置
format = wav
sample_rate = 16000
channels = 1
bit_depth = 16

# 缓冲配置
buffer_size = 4096
chunk_size = 1024

[STREAM]
# 流处理配置
stream_protocol = websocket
stream_host = 0.0.0.0
stream_port = 8765

# 实时流配置
realtime_processing = true
chunk_duration_ms = 100
max_silence_ms = 3000

[LOGGING]
# 日志配置
log_level = INFO
log_file = /var/log/mrcp_stream.log
log_format = %(asctime)s - %(name)s - %(levelname)s - %(message)s
