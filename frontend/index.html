<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freeswitch????????</title>
    <link href="https://cdn.jsdelivr.net/npm/antd@5.12.2/dist/reset.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            font-size: 28px;
            color: #1a202c;
            margin-bottom: 8px;
        }

        .header p {
            color: #718096;
            font-size: 14px;
        }

        .status-bar {
            display: flex;
            gap: 16px;
            align-items: center;
            margin-top: 16px;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: #f7fafc;
            border-radius: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }

        .status-dot.online {
            background: #48bb78;
        }

        .status-dot.offline {
            background: #f56565;
            animation: none;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        .main-content {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 24px;
        }

        .sessions-panel {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            height: calc(100vh - 200px);
            overflow-y: auto;
        }

        .sessions-panel h2 {
            font-size: 18px;
            margin-bottom: 16px;
            color: #2d3748;
        }

        .session-item {
            padding: 12px;
            margin-bottom: 8px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .session-item:hover {
            border-color: #667eea;
            background: #f7fafc;
        }

        .session-item.active {
            border-color: #667eea;
            background: #ebf4ff;
        }

        .session-id {
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 4px;
        }

        .session-info {
            font-size: 12px;
            color: #718096;
        }

        .chat-panel {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            height: calc(100vh - 200px);
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 16px;
            margin-bottom: 20px;
        }

        .chat-header h2 {
            font-size: 20px;
            color: #2d3748;
            margin-bottom: 8px;
        }

        .call-info {
            display: flex;
            gap: 24px;
            font-size: 14px;
            color: #718096;
        }

        .call-info-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px 0;
        }

        .message {
            display: flex;
            margin-bottom: 24px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.customer {
            justify-content: flex-start;
        }

        .message.agent {
            justify-content: flex-end;
        }

        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: white;
            font-size: 14px;
            flex-shrink: 0;
        }

        .message.customer .message-avatar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin-right: 12px;
        }

        .message.agent .message-avatar {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            margin-left: 12px;
            order: 2;
        }

        .message-content {
            max-width: 60%;
        }

        .message-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }

        .message.agent .message-header {
            justify-content: flex-end;
        }

        .message-role {
            font-size: 12px;
            font-weight: 600;
            color: #4a5568;
        }

        .message-time {
            font-size: 11px;
            color: #a0aec0;
        }

        .message-text {
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 14px;
        }

        .message.customer .message-text {
            background: #f7fafc;
            color: #2d3748;
            border-bottom-left-radius: 4px;
        }

        .message.agent .message-text {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #a0aec0;
        }

        .empty-state svg {
            width: 120px;
            height: 120px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-state p {
            font-size: 16px;
        }

        /* ????? */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e0;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #a0aec0;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #718096;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>??? Freeswitch????????</h1>
            <p>???????????????AI????????</p>
            <div class="status-bar">
                <div class="status-item">
                    <div class="status-dot" id="ws-status"></div>
                    <span id="ws-status-text">???...</span>
                </div>
                <div class="status-item">
                    <span>?? ????: <strong id="active-sessions-count">0</strong></span>
                </div>
                <div class="status-item">
                    <span>?? ???: <strong id="message-count">0</strong></span>
                </div>
            </div>
        </div>

        <div class="main-content">
            <div class="sessions-panel">
                <h2>?? ????</h2>
                <div id="sessions-list">
                    <div class="loading">????...</div>
                </div>
            </div>

            <div class="chat-panel">
                <div id="chat-content">
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
                        </svg>
                        <p>?????????????</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="./src/app.js"></script>
</body>
</html>
