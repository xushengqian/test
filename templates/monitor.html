<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统监控面板 - FreeSWITCH 音转文系统</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f7fa;
            color: #333;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .card h3 {
            color: #4a5568;
            margin-bottom: 15px;
            font-size: 1.2rem;
        }
        
        .metric {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #e2e8f0;
        }
        
        .metric:last-child {
            border-bottom: none;
        }
        
        .metric-label {
            font-weight: 500;
            color: #4a5568;
        }
        
        .metric-value {
            font-weight: 600;
            font-size: 1.1rem;
        }
        
        .status-healthy {
            color: #38a169;
        }
        
        .status-warning {
            color: #d69e2e;
        }
        
        .status-error {
            color: #e53e3e;
        }
        
        .chart-container {
            position: relative;
            height: 300px;
            margin-top: 20px;
        }
        
        .refresh-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            margin-bottom: 20px;
        }
        
        .refresh-btn:hover {
            transform: translateY(-2px);
        }
        
        .auto-refresh {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .auto-refresh input[type="checkbox"] {
            transform: scale(1.2);
        }
        
        .loading {
            text-align: center;
            color: #718096;
            font-style: italic;
        }
        
        .error {
            color: #e53e3e;
            background: #fed7d7;
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
        }
        
        .grid-2 {
            grid-column: span 2;
        }
        
        .grid-full {
            grid-column: 1 / -1;
        }
        
        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
            
            .grid-2, .grid-full {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📊 系统监控面板</h1>
        <p>FreeSWITCH 人工外呼实时音转文系统</p>
    </div>
    
    <div class="container">
        <div class="auto-refresh">
            <button class="refresh-btn" onclick="refreshData()">🔄 刷新数据</button>
            <label>
                <input type="checkbox" id="autoRefresh" onchange="toggleAutoRefresh()">
                自动刷新 (30秒)
            </label>
        </div>
        
        <div class="dashboard">
            <!-- 系统状态 -->
            <div class="card">
                <h3>💚 系统状态</h3>
                <div id="systemStatus" class="loading">加载中...</div>
            </div>
            
            <!-- 性能指标 -->
            <div class="card">
                <h3>⚡ 性能指标</h3>
                <div id="performanceMetrics" class="loading">加载中...</div>
            </div>
            
            <!-- 通话统计 -->
            <div class="card">
                <h3>📞 通话统计</h3>
                <div id="callStats" class="loading">加载中...</div>
            </div>
            
            <!-- 转写统计 -->
            <div class="card">
                <h3>📝 转写统计</h3>
                <div id="transcriptionStats" class="loading">加载中...</div>
            </div>
            
            <!-- 系统资源 -->
            <div class="card grid-2">
                <h3>🖥️ 系统资源</h3>
                <div id="systemResources" class="loading">加载中...</div>
            </div>
            
            <!-- 限流状态 -->
            <div class="card">
                <h3>🚦 限流状态</h3>
                <div id="rateLimitStatus" class="loading">加载中...</div>
            </div>
            
            <!-- 性能图表 -->
            <div class="card grid-full">
                <h3>📈 性能趋势</h3>
                <div class="chart-container">
                    <canvas id="performanceChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        let autoRefreshInterval = null;
        let performanceChart = null;
        let chartData = {
            labels: [],
            cpu: [],
            memory: [],
            calls: []
        };
        
        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', function() {
            refreshData();
            initChart();
        });
        
        // 刷新数据
        async function refreshData() {
            try {
                await Promise.all([
                    loadSystemHealth(),
                    loadPerformanceMetrics(),
                    loadCallStats(),
                    loadTranscriptionStats(),
                    loadSystemResources(),
                    loadRateLimitStatus()
                ]);
            } catch (error) {
                console.error('Error refreshing data:', error);
            }
        }
        
        // 加载系统健康状态
        async function loadSystemHealth() {
            try {
                const response = await fetch('/api/health');
                const data = await response.json();
                
                const statusDiv = document.getElementById('systemStatus');
                const statusClass = `status-${data.status}`;
                
                statusDiv.innerHTML = `
                    <div class="metric">
                        <span class="metric-label">系统状态</span>
                        <span class="metric-value ${statusClass}">${getStatusText(data.status)}</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">运行时间</span>
                        <span class="metric-value">${formatUptime(data.system_health?.uptime_seconds || 0)}</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">活跃通话</span>
                        <span class="metric-value">${data.performance?.active_calls || 0}</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">WebSocket连接</span>
                        <span class="metric-value">${data.performance?.websocket_connections || 0}</span>
                    </div>
                `;
                
                // 显示警告和错误
                if (data.system_health?.warnings?.length > 0) {
                    statusDiv.innerHTML += `
                        <div class="error">
                            ⚠️ 警告: ${data.system_health.warnings.join(', ')}
                        </div>
                    `;
                }
                
                if (data.system_health?.errors?.length > 0) {
                    statusDiv.innerHTML += `
                        <div class="error">
                            ❌ 错误: ${data.system_health.errors.join(', ')}
                        </div>
                    `;
                }
                
            } catch (error) {
                document.getElementById('systemStatus').innerHTML = 
                    `<div class="error">加载失败: ${error.message}</div>`;
            }
        }
        
        // 加载性能指标
        async function loadPerformanceMetrics() {
            try {
                const response = await fetch('/api/metrics');
                const data = await response.json();
                
                const current = data.current;
                const performance = data.performance;
                
                document.getElementById('performanceMetrics').innerHTML = `
                    <div class="metric">
                        <span class="metric-label">CPU使用率</span>
                        <span class="metric-value">${current.cpu?.percent || 0}%</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">内存使用率</span>
                        <span class="metric-value">${current.memory?.percent || 0}%</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">磁盘使用率</span>
                        <span class="metric-value">${current.disk?.percent || 0}%</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">转写次数</span>
                        <span class="metric-value">${performance?.transcription_count || 0}</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">平均转写时间</span>
                        <span class="metric-value">${performance?.avg_transcription_time || 0}秒</span>
                    </div>
                `;
                
                // 更新图表数据
                updateChartData(current);
                
            } catch (error) {
                document.getElementById('performanceMetrics').innerHTML = 
                    `<div class="error">加载失败: ${error.message}</div>`;
            }
        }
        
        // 加载通话统计
        async function loadCallStats() {
            try {
                const response = await fetch('/api/calls');
                const data = await response.json();
                
                const calls = data.calls || [];
                const activeCalls = calls.filter(c => c.status === 'active').length;
                const endedCalls = calls.filter(c => c.status === 'ended').length;
                const failedCalls = calls.filter(c => c.status === 'failed').length;
                
                document.getElementById('callStats').innerHTML = `
                    <div class="metric">
                        <span class="metric-label">总通话数</span>
                        <span class="metric-value">${calls.length}</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">进行中</span>
                        <span class="metric-value status-healthy">${activeCalls}</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">已结束</span>
                        <span class="metric-value">${endedCalls}</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">失败</span>
                        <span class="metric-value status-error">${failedCalls}</span>
                    </div>
                `;
                
            } catch (error) {
                document.getElementById('callStats').innerHTML = 
                    `<div class="error">加载失败: ${error.message}</div>`;
            }
        }
        
        // 加载转写统计
        async function loadTranscriptionStats() {
            try {
                const response = await fetch('/api/speech/status');
                const data = await response.json();
                
                document.getElementById('transcriptionStats').innerHTML = `
                    <div class="metric">
                        <span class="metric-label">处理队列大小</span>
                        <span class="metric-value">${data.queue_size || 0}</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">转写速率</span>
                        <span class="metric-value">${data.transcription_rate || 0}/秒</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">缓冲区数量</span>
                        <span class="metric-value">${Object.keys(data.buffer_info || {}).length}</span>
                    </div>
                `;
                
            } catch (error) {
                document.getElementById('transcriptionStats').innerHTML = 
                    `<div class="error">加载失败: ${error.message}</div>`;
            }
        }
        
        // 加载系统资源
        async function loadSystemResources() {
            try {
                const response = await fetch('/api/metrics');
                const data = await response.json();
                
                const current = data.current;
                
                document.getElementById('systemResources').innerHTML = `
                    <div class="metric">
                        <span class="metric-label">CPU核心数</span>
                        <span class="metric-value">${current.cpu?.count || 0}</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">总内存</span>
                        <span class="metric-value">${current.memory?.total_gb || 0}GB</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">可用内存</span>
                        <span class="metric-value">${current.memory?.available_gb || 0}GB</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">磁盘空间</span>
                        <span class="metric-value">${current.disk?.total_gb || 0}GB</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">网络发送</span>
                        <span class="metric-value">${formatBytes(current.network?.bytes_sent || 0)}</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">网络接收</span>
                        <span class="metric-value">${formatBytes(current.network?.bytes_recv || 0)}</span>
                    </div>
                `;
                
            } catch (error) {
                document.getElementById('systemResources').innerHTML = 
                    `<div class="error">加载失败: ${error.message}</div>`;
            }
        }
        
        // 加载限流状态
        async function loadRateLimitStatus() {
            try {
                const response = await fetch('/api/calls');
                const data = await response.json();
                
                const rateLimit = data.rate_limit_info || {};
                
                document.getElementById('rateLimitStatus').innerHTML = `
                    <div class="metric">
                        <span class="metric-label">活跃通话</span>
                        <span class="metric-value">${rateLimit.active_calls || 0}/${rateLimit.max_concurrent_calls || 0}</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">剩余通话/分钟</span>
                        <span class="metric-value">${rateLimit.remaining_calls_per_minute || 0}</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">最大并发</span>
                        <span class="metric-value">${rateLimit.max_concurrent_calls || 0}</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">每分钟限制</span>
                        <span class="metric-value">${rateLimit.max_calls_per_minute || 0}</span>
                    </div>
                `;
                
            } catch (error) {
                document.getElementById('rateLimitStatus').innerHTML = 
                    `<div class="error">加载失败: ${error.message}</div>`;
            }
        }
        
        // 初始化图表
        function initChart() {
            const ctx = document.getElementById('performanceChart').getContext('2d');
            performanceChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: chartData.labels,
                    datasets: [
                        {
                            label: 'CPU使用率 (%)',
                            data: chartData.cpu,
                            borderColor: '#667eea',
                            backgroundColor: 'rgba(102, 126, 234, 0.1)',
                            tension: 0.4
                        },
                        {
                            label: '内存使用率 (%)',
                            data: chartData.memory,
                            borderColor: '#764ba2',
                            backgroundColor: 'rgba(118, 75, 162, 0.1)',
                            tension: 0.4
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 100
                        }
                    },
                    plugins: {
                        legend: {
                            position: 'top'
                        }
                    }
                }
            });
        }
        
        // 更新图表数据
        function updateChartData(current) {
            const now = new Date().toLocaleTimeString();
            
            chartData.labels.push(now);
            chartData.cpu.push(current.cpu?.percent || 0);
            chartData.memory.push(current.memory?.percent || 0);
            
            // 只保留最近20个数据点
            if (chartData.labels.length > 20) {
                chartData.labels.shift();
                chartData.cpu.shift();
                chartData.memory.shift();
            }
            
            if (performanceChart) {
                performanceChart.update();
            }
        }
        
        // 切换自动刷新
        function toggleAutoRefresh() {
            const checkbox = document.getElementById('autoRefresh');
            
            if (checkbox.checked) {
                autoRefreshInterval = setInterval(refreshData, 30000); // 30秒
            } else {
                if (autoRefreshInterval) {
                    clearInterval(autoRefreshInterval);
                    autoRefreshInterval = null;
                }
            }
        }
        
        // 工具函数
        function getStatusText(status) {
            const statusMap = {
                'healthy': '健康',
                'warning': '警告',
                'error': '错误'
            };
            return statusMap[status] || status;
        }
        
        function formatUptime(seconds) {
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            return `${hours}小时${minutes}分钟`;
        }
        
        function formatBytes(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }
    </script>
</body>
</html>
