<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreeSWITCH 人工外呼实时音转文系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }
        
        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
        }
        
        .card:hover {
            transform: translateY(-5px);
        }
        
        .card h2 {
            color: #4a5568;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #4a5568;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease;
            width: 100%;
        }
        
        .btn:hover {
            transform: translateY(-2px);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #e53e3e 0%, #c53030 100%);
        }
        
        .calls-list {
            grid-column: 1 / -1;
        }
        
        .call-item {
            background: #f7fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .call-info {
            flex: 1;
        }
        
        .call-number {
            font-weight: 600;
            color: #2d3748;
            font-size: 1.1rem;
        }
        
        .call-status {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
        }
        
        .status-active {
            background: #c6f6d5;
            color: #22543d;
        }
        
        .status-ended {
            background: #fed7d7;
            color: #742a2a;
        }
        
        .status-failed {
            background: #fbb6ce;
            color: #702459;
        }
        
        .transcription-panel {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-top: 20px;
        }
        
        .transcription-content {
            background: #f7fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 20px;
            min-height: 200px;
            max-height: 400px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            line-height: 1.6;
        }
        
        .transcription-item {
            margin-bottom: 10px;
            padding: 8px;
            background: white;
            border-radius: 4px;
            border-left: 4px solid #667eea;
        }
        
        .transcription-time {
            font-size: 0.8rem;
            color: #718096;
            margin-bottom: 4px;
        }
        
        .transcription-text {
            color: #2d3748;
        }
        
        .loading {
            text-align: center;
            color: #718096;
            font-style: italic;
        }
        
        .error {
            color: #e53e3e;
            background: #fed7d7;
            padding: 10px;
            border-radius: 4px;
            margin: 10px 0;
        }
        
        .success {
            color: #22543d;
            background: #c6f6d5;
            padding: 10px;
            border-radius: 4px;
            margin: 10px 0;
        }
        
        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 FreeSWITCH 人工外呼实时音转文系统</h1>
            <p>智能外呼管理与实时语音转写平台</p>
        </div>
        
        <div class="dashboard">
            <div class="card">
                <h2>📞 发起外呼</h2>
                <form id="callForm">
                    <div class="form-group">
                        <label for="phoneNumber">电话号码</label>
                        <input type="tel" id="phoneNumber" placeholder="请输入电话号码" required>
                    </div>
                    <div class="form-group">
                        <label for="agentId">坐席ID</label>
                        <input type="text" id="agentId" placeholder="坐席ID (可选)" value="default">
                    </div>
                    <button type="submit" class="btn" id="startCallBtn">开始外呼</button>
                </form>
                <div id="callMessage"></div>
            </div>
            
            <div class="card">
                <h2>📊 通话控制</h2>
                <div id="currentCall" style="display: none;">
                    <p><strong>当前通话:</strong> <span id="currentCallNumber"></span></p>
                    <p><strong>通话ID:</strong> <span id="currentCallId"></span></p>
                    <button class="btn btn-danger" id="endCallBtn">结束通话</button>
                </div>
                <div id="noCall" class="loading">
                    暂无活跃通话
                </div>
            </div>
        </div>
        
        <div class="card calls-list">
            <h2>📋 通话记录</h2>
            <div id="callsList">
                <div class="loading">加载中...</div>
            </div>
        </div>
        
        <div class="transcription-panel">
            <h2>📝 实时转写</h2>
            <div id="transcriptionContent" class="transcription-content">
                <div class="loading">等待通话开始...</div>
            </div>
        </div>
    </div>

    <script>
        let currentCallId = null;
        let websocket = null;
        
        // 页面加载时获取通话列表
        document.addEventListener('DOMContentLoaded', function() {
            loadCalls();
            
            // 表单提交处理
            document.getElementById('callForm').addEventListener('submit', startCall);
            document.getElementById('endCallBtn').addEventListener('click', endCall);
        });
        
        // 发起外呼
        async function startCall(e) {
            e.preventDefault();
            
            const phoneNumber = document.getElementById('phoneNumber').value;
            const agentId = document.getElementById('agentId').value;
            const startBtn = document.getElementById('startCallBtn');
            const messageDiv = document.getElementById('callMessage');
            
            startBtn.disabled = true;
            startBtn.textContent = '发起中...';
            
            try {
                const response = await fetch('/api/calls/start', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: `phone_number=${encodeURIComponent(phoneNumber)}&agent_id=${encodeURIComponent(agentId)}`
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    currentCallId = result.call_id;
                    showMessage('success', `外呼已发起: ${phoneNumber}`);
                    updateCurrentCall(result.call_id, phoneNumber);
                    connectWebSocket(result.call_id);
                    loadCalls();
                } else {
                    showMessage('error', `外呼失败: ${result.detail}`);
                }
            } catch (error) {
                showMessage('error', `网络错误: ${error.message}`);
            } finally {
                startBtn.disabled = false;
                startBtn.textContent = '开始外呼';
            }
        }
        
        // 结束通话
        async function endCall() {
            if (!currentCallId) return;
            
            const endBtn = document.getElementById('endCallBtn');
            endBtn.disabled = true;
            endBtn.textContent = '结束中...';
            
            try {
                const response = await fetch(`/api/calls/${currentCallId}/end`, {
                    method: 'POST'
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    showMessage('success', '通话已结束');
                    currentCallId = null;
                    updateCurrentCall(null, null);
                    disconnectWebSocket();
                    loadCalls();
                } else {
                    showMessage('error', `结束通话失败: ${result.detail}`);
                }
            } catch (error) {
                showMessage('error', `网络错误: ${error.message}`);
            } finally {
                endBtn.disabled = false;
                endBtn.textContent = '结束通话';
            }
        }
        
        // 更新当前通话显示
        function updateCurrentCall(callId, phoneNumber) {
            const currentCallDiv = document.getElementById('currentCall');
            const noCallDiv = document.getElementById('noCall');
            
            if (callId) {
                document.getElementById('currentCallId').textContent = callId;
                document.getElementById('currentCallNumber').textContent = phoneNumber;
                currentCallDiv.style.display = 'block';
                noCallDiv.style.display = 'none';
            } else {
                currentCallDiv.style.display = 'none';
                noCallDiv.style.display = 'block';
            }
        }
        
        // 连接WebSocket
        function connectWebSocket(callId) {
            if (websocket) {
                websocket.close();
            }
            
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws/${callId}`;
            
            websocket = new WebSocket(wsUrl);
            
            websocket.onopen = function() {
                console.log('WebSocket connected');
            };
            
            websocket.onmessage = function(event) {
                const data = JSON.parse(event.data);
                if (data.type === 'transcription') {
                    addTranscription(data.text, data.timestamp);
                }
            };
            
            websocket.onclose = function() {
                console.log('WebSocket disconnected');
            };
            
            websocket.onerror = function(error) {
                console.error('WebSocket error:', error);
            };
        }
        
        // 断开WebSocket
        function disconnectWebSocket() {
            if (websocket) {
                websocket.close();
                websocket = null;
            }
        }
        
        // 添加转写内容
        function addTranscription(text, timestamp) {
            const contentDiv = document.getElementById('transcriptionContent');
            
            // 移除加载提示
            const loading = contentDiv.querySelector('.loading');
            if (loading) {
                loading.remove();
            }
            
            // 创建转写项
            const item = document.createElement('div');
            item.className = 'transcription-item';
            
            const time = new Date(timestamp).toLocaleTimeString();
            item.innerHTML = `
                <div class="transcription-time">${time}</div>
                <div class="transcription-text">${text}</div>
            `;
            
            contentDiv.appendChild(item);
            contentDiv.scrollTop = contentDiv.scrollHeight;
        }
        
        // 加载通话列表
        async function loadCalls() {
            try {
                const response = await fetch('/api/calls');
                const result = await response.json();
                
                const callsList = document.getElementById('callsList');
                callsList.innerHTML = '';
                
                if (result.calls.length === 0) {
                    callsList.innerHTML = '<div class="loading">暂无通话记录</div>';
                    return;
                }
                
                result.calls.forEach(call => {
                    const callItem = document.createElement('div');
                    callItem.className = 'call-item';
                    
                    const statusClass = `status-${call.status}`;
                    const startTime = call.start_time ? new Date(call.start_time).toLocaleString() : '未知';
                    
                    callItem.innerHTML = `
                        <div class="call-info">
                            <div class="call-number">${call.phone_number}</div>
                            <div>坐席: ${call.agent_id} | 开始时间: ${startTime}</div>
                        </div>
                        <div class="call-status ${statusClass}">${getStatusText(call.status)}</div>
                    `;
                    
                    callsList.appendChild(callItem);
                });
            } catch (error) {
                console.error('Error loading calls:', error);
                document.getElementById('callsList').innerHTML = '<div class="error">加载通话记录失败</div>';
            }
        }
        
        // 获取状态文本
        function getStatusText(status) {
            const statusMap = {
                'initiating': '发起中',
                'active': '进行中',
                'ended': '已结束',
                'failed': '失败'
            };
            return statusMap[status] || status;
        }
        
        // 显示消息
        function showMessage(type, text) {
            const messageDiv = document.getElementById('callMessage');
            messageDiv.innerHTML = `<div class="${type}">${text}</div>`;
            
            // 3秒后清除消息
            setTimeout(() => {
                messageDiv.innerHTML = '';
            }, 3000);
        }
    </script>
</body>
</html>
