# 数据库连接配置
database.url=jdbc:mysql://localhost:3306/testdb
database.username=root
database.password=password
database.driver=com.mysql.cj.jdbc.Driver

# 连接池配置
pool.initial.size=10
pool.min.size=5
pool.max.size=30
pool.connection.timeout=30000
pool.idle.timeout=600000
pool.max.lifetime=1800000
pool.validation.query=SELECT 1

# 线程池配置
thread.pool.core.size=0
thread.pool.max.size=0
thread.pool.queue.capacity=1000
thread.pool.keep.alive.seconds=60
# 如果为0，则自动计算最优值
thread.pool.auto.calculate=true

# 任务类型配置
# CPU_INTENSIVE, IO_INTENSIVE, DATABASE_QUERY, MIXED
task.type=DATABASE_QUERY

# 性能优化配置
# 平均查询响应时间（毫秒）
performance.avg.query.time=100
# 平均结果处理时间（毫秒）
performance.avg.processing.time=10
# 预期并发数
performance.expected.concurrency=100

# 自适应调整配置
adaptive.enabled=true
# 调整间隔（秒）
adaptive.adjustment.interval=30
# CPU使用率阈值
adaptive.cpu.threshold=0.8
# 内存使用率阈值
adaptive.memory.threshold=0.85
# 负载因子高阈值
adaptive.load.factor.high=0.9
# 负载因子低阈值
adaptive.load.factor.low=0.3

# 监控配置
monitoring.enabled=true
# 监控报告间隔（秒）
monitoring.report.interval=60
# 指标保留时间（分钟）
monitoring.metrics.retention=10

# 批处理配置
batch.size=1000
batch.timeout=30000

# 日志配置
logging.level.root=INFO
logging.level.com.example.concurrent.db=DEBUG
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n