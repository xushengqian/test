<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreeSwtich 实时音频流</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        .card h2 {
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }
        .status {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #dc3545;
        }
        .status-indicator.connected {
            background: #28a745;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
            margin-right: 10px;
            margin-bottom: 10px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        .btn-danger {
            background: #dc3545;
            color: white;
        }
        .btn-danger:hover {
            background: #c82333;
        }
        .btn-success {
            background: #28a745;
            color: white;
        }
        .btn-success:hover {
            background: #218838;
        }
        .log-container {
            background: #1e1e1e;
            border-radius: 8px;
            padding: 15px;
            height: 300px;
            overflow-y: auto;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 13px;
        }
        .log-entry {
            margin-bottom: 5px;
            padding: 5px 10px;
            border-radius: 4px;
        }
        .log-info { color: #58a6ff; }
        .log-success { color: #3fb950; }
        .log-warning { color: #d29922; }
        .log-error { color: #f85149; }
        .log-audio { color: #a371f7; }
        .audio-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .stat-card {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }
        .stat-label {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }
        .visualizer {
            background: #1e1e1e;
            border-radius: 8px;
            height: 100px;
            margin-top: 15px;
        }
        #waveform {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎙️ FreeSwtich 实时音频流</h1>
        
        <!-- 连接状态 -->
        <div class="card">
            <h2>WebSocket 连接</h2>
            <div class="status">
                <div class="status-indicator" id="wsStatus"></div>
                <span id="wsStatusText">未连接</span>
            </div>
            <div class="form-group">
                <label>WebSocket 地址</label>
                <input type="text" id="wsUrl" value="ws://localhost:8080/ws/audio">
            </div>
            <button class="btn btn-primary" onclick="connect()">连接</button>
            <button class="btn btn-danger" onclick="disconnect()">断开</button>
        </div>
        
        <!-- 订阅管理 -->
        <div class="card">
            <h2>音频流订阅</h2>
            <div class="form-group">
                <label>通话 UUID</label>
                <input type="text" id="uuid" placeholder="输入通话UUID">
            </div>
            <button class="btn btn-success" onclick="subscribe()">订阅</button>
            <button class="btn btn-danger" onclick="unsubscribe()">取消订阅</button>
        </div>
        
        <!-- 音频统计 -->
        <div class="card">
            <h2>音频数据统计</h2>
            <div class="audio-stats">
                <div class="stat-card">
                    <div class="stat-value" id="frameCount">0</div>
                    <div class="stat-label">接收帧数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="dataSize">0</div>
                    <div class="stat-label">数据量 (KB)</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="sampleRate">-</div>
                    <div class="stat-label">采样率 (Hz)</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="channels">-</div>
                    <div class="stat-label">通道数</div>
                </div>
            </div>
            
            <!-- 波形显示 -->
            <div class="visualizer">
                <canvas id="waveform"></canvas>
            </div>
        </div>
        
        <!-- 日志 -->
        <div class="card">
            <h2>消息日志</h2>
            <div class="log-container" id="logContainer"></div>
        </div>
    </div>

    <script>
        let ws = null;
        let frameCount = 0;
        let totalDataSize = 0;
        let audioBuffer = [];
        let canvas, ctx;
        
        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            canvas = document.getElementById('waveform');
            ctx = canvas.getContext('2d');
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
        });
        
        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            drawWaveform();
        }
        
        // WebSocket 连接
        function connect() {
            const url = document.getElementById('wsUrl').value;
            
            try {
                ws = new WebSocket(url);
                
                ws.onopen = () => {
                    updateStatus(true);
                    log('WebSocket 连接成功', 'success');
                };
                
                ws.onmessage = (event) => {
                    handleMessage(JSON.parse(event.data));
                };
                
                ws.onerror = (error) => {
                    log('WebSocket 错误: ' + error.message, 'error');
                };
                
                ws.onclose = () => {
                    updateStatus(false);
                    log('WebSocket 连接已关闭', 'warning');
                };
                
            } catch (e) {
                log('连接失败: ' + e.message, 'error');
            }
        }
        
        function disconnect() {
            if (ws) {
                ws.close();
                ws = null;
            }
        }
        
        function updateStatus(connected) {
            const indicator = document.getElementById('wsStatus');
            const text = document.getElementById('wsStatusText');
            
            if (connected) {
                indicator.classList.add('connected');
                text.textContent = '已连接';
            } else {
                indicator.classList.remove('connected');
                text.textContent = '未连接';
            }
        }
        
        // 订阅
        function subscribe() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                log('请先连接 WebSocket', 'warning');
                return;
            }
            
            const uuid = document.getElementById('uuid').value;
            if (!uuid) {
                log('请输入通话 UUID', 'warning');
                return;
            }
            
            ws.send(JSON.stringify({
                type: 'subscribe',
                uuid: uuid
            }));
            
            log('发送订阅请求: ' + uuid, 'info');
        }
        
        function unsubscribe() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                return;
            }
            
            const uuid = document.getElementById('uuid').value;
            if (!uuid) {
                return;
            }
            
            ws.send(JSON.stringify({
                type: 'unsubscribe',
                uuid: uuid
            }));
            
            log('取消订阅: ' + uuid, 'info');
        }
        
        // 处理消息
        function handleMessage(msg) {
            switch (msg.type) {
                case 'connected':
                    log('服务器: ' + msg.message, 'success');
                    break;
                    
                case 'subscribed':
                    log('已订阅通话: ' + msg.uuid, 'success');
                    break;
                    
                case 'unsubscribed':
                    log('已取消订阅: ' + msg.uuid, 'info');
                    break;
                    
                case 'audio':
                    handleAudioData(msg);
                    break;
                    
                case 'event':
                    log('事件: ' + msg.event + ' - ' + JSON.stringify(msg.data), 'info');
                    break;
                    
                case 'pong':
                    // 心跳响应
                    break;
                    
                case 'error':
                    log('错误: ' + msg.message, 'error');
                    break;
                    
                default:
                    log('未知消息: ' + JSON.stringify(msg), 'warning');
            }
        }
        
        // 处理音频数据
        function handleAudioData(msg) {
            frameCount++;
            
            // 解码 Base64 音频数据
            const binaryStr = atob(msg.data);
            const len = binaryStr.length;
            totalDataSize += len;
            
            // 转换为 Int16 数组用于波形显示
            const samples = new Int16Array(len / 2);
            for (let i = 0; i < len; i += 2) {
                samples[i / 2] = binaryStr.charCodeAt(i) | (binaryStr.charCodeAt(i + 1) << 8);
            }
            
            // 更新波形缓冲
            audioBuffer = [...audioBuffer.slice(-500), ...Array.from(samples)];
            
            // 更新统计
            document.getElementById('frameCount').textContent = frameCount;
            document.getElementById('dataSize').textContent = (totalDataSize / 1024).toFixed(2);
            document.getElementById('sampleRate').textContent = msg.sampleRate;
            document.getElementById('channels').textContent = msg.channels;
            
            // 绘制波形
            drawWaveform();
            
            // 日志 (每10帧输出一次)
            if (frameCount % 10 === 0) {
                log(`音频帧 #${msg.sequence} | ${len} bytes | ${msg.direction}`, 'audio');
            }
        }
        
        // 绘制波形
        function drawWaveform() {
            ctx.fillStyle = '#1e1e1e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            if (audioBuffer.length === 0) return;
            
            ctx.strokeStyle = '#667eea';
            ctx.lineWidth = 1;
            ctx.beginPath();
            
            const step = Math.ceil(audioBuffer.length / canvas.width);
            const centerY = canvas.height / 2;
            const scale = canvas.height / 65536;
            
            for (let i = 0; i < canvas.width; i++) {
                const idx = Math.floor(i * step);
                const sample = audioBuffer[idx] || 0;
                const y = centerY - (sample * scale);
                
                if (i === 0) {
                    ctx.moveTo(i, y);
                } else {
                    ctx.lineTo(i, y);
                }
            }
            
            ctx.stroke();
        }
        
        // 日志
        function log(message, type = 'info') {
            const container = document.getElementById('logContainer');
            const entry = document.createElement('div');
            entry.className = 'log-entry log-' + type;
            
            const time = new Date().toLocaleTimeString();
            entry.textContent = `[${time}] ${message}`;
            
            container.appendChild(entry);
            container.scrollTop = container.scrollHeight;
            
            // 限制日志条数
            while (container.children.length > 200) {
                container.removeChild(container.firstChild);
            }
        }
        
        // 心跳
        setInterval(() => {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'ping' }));
            }
        }, 30000);
    </script>
</body>
</html>
