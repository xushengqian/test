version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:6
    container_name: robot_call_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: robot_call_system
    volumes:
      - mongodb_data:/data/db
    networks:
      - robot_call_network

  # Redis for session management
  redis:
    image: redis:7-alpine
    container_name: robot_call_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - robot_call_network

  # Backend API Server
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: robot_call_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://admin:admin123@mongodb:27017/robot_call_system?authSource=admin
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: your_production_jwt_secret_change_this
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - robot_call_network

  # Frontend React App
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: robot_call_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - robot_call_network

  # Nginx Reverse Proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: robot_call_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - robot_call_network

networks:
  robot_call_network:
    driver: bridge

volumes:
  mongodb_data: