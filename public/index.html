<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能外呼系统 - 控制台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@6.0.0/css/all.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- 导航栏 -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">
                    <i class="fas fa-phone-volume"></i> 智能外呼系统
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item">
                            <a class="nav-link active" href="#dashboard">
                                <i class="fas fa-tachometer-alt"></i> 仪表盘
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#campaigns">
                                <i class="fas fa-bullhorn"></i> 外呼任务
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#agents">
                                <i class="fas fa-headset"></i> 坐席管理
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#calls">
                                <i class="fas fa-phone"></i> 通话监控
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#reports">
                                <i class="fas fa-chart-bar"></i> 报表分析
                            </a>
                        </li>
                    </ul>
                    <div class="navbar-text">
                        <span class="text-white me-3">
                            <i class="fas fa-user"></i> <span id="username">管理员</span>
                        </span>
                        <button class="btn btn-outline-light btn-sm" onclick="logout()">
                            <i class="fas fa-sign-out-alt"></i> 退出
                        </button>
                    </div>
                </div>
            </div>
        </nav>

        <!-- 主内容区域 -->
        <div class="container-fluid mt-4">
            <!-- 实时统计卡片 -->
            <div class="row mb-4" id="stats-cards">
                <div class="col-md-3">
                    <div class="card bg-success text-white">
                        <div class="card-body">
                            <h5 class="card-title">
                                <i class="fas fa-phone-alt"></i> 当前通话
                            </h5>
                            <h2 class="mb-0" id="active-calls">0</h2>
                            <small>机器人: <span id="robot-calls">0</span> | 人工: <span id="agent-calls">0</span></small>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card bg-info text-white">
                        <div class="card-body">
                            <h5 class="card-title">
                                <i class="fas fa-users"></i> 在线坐席
                            </h5>
                            <h2 class="mb-0" id="online-agents">0</h2>
                            <small>空闲: <span id="available-agents">0</span> | 忙碌: <span id="busy-agents">0</span></small>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card bg-warning text-white">
                        <div class="card-body">
                            <h5 class="card-title">
                                <i class="fas fa-hourglass-half"></i> 排队等待
                            </h5>
                            <h2 class="mb-0" id="queued-calls">0</h2>
                            <small>待呼: <span id="pending-calls">0</span></small>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card bg-primary text-white">
                        <div class="card-body">
                            <h5 class="card-title">
                                <i class="fas fa-tasks"></i> 活动任务
                            </h5>
                            <h2 class="mb-0" id="active-campaigns">0</h2>
                            <small>今日完成: <span id="completed-today">0</span></small>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 选项卡内容 -->
            <div class="tab-content" id="main-content">
                <!-- 仪表盘 -->
                <div class="tab-pane fade show active" id="dashboard">
                    <div class="row">
                        <div class="col-md-8">
                            <div class="card">
                                <div class="card-header">
                                    <h5><i class="fas fa-chart-line"></i> 实时呼叫趋势</h5>
                                </div>
                                <div class="card-body">
                                    <canvas id="call-trend-chart" height="100"></canvas>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="card">
                                <div class="card-header">
                                    <h5><i class="fas fa-list"></i> 最新呼叫</h5>
                                </div>
                                <div class="card-body" style="max-height: 400px; overflow-y: auto;">
                                    <div id="recent-calls-list">
                                        <!-- 动态加载 -->
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 外呼任务管理 -->
                <div class="tab-pane fade" id="campaigns">
                    <div class="card">
                        <div class="card-header">
                            <div class="d-flex justify-content-between align-items-center">
                                <h5><i class="fas fa-bullhorn"></i> 外呼任务管理</h5>
                                <button class="btn btn-success" onclick="showCreateCampaignModal()">
                                    <i class="fas fa-plus"></i> 创建任务
                                </button>
                            </div>
                        </div>
                        <div class="card-body">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>任务名称</th>
                                        <th>状态</th>
                                        <th>总数</th>
                                        <th>已完成</th>
                                        <th>接通率</th>
                                        <th>创建时间</th>
                                        <th>操作</th>
                                    </tr>
                                </thead>
                                <tbody id="campaigns-table">
                                    <!-- 动态加载 -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- 坐席管理 -->
                <div class="tab-pane fade" id="agents">
                    <div class="card">
                        <div class="card-header">
                            <h5><i class="fas fa-headset"></i> 坐席状态监控</h5>
                        </div>
                        <div class="card-body">
                            <div class="row" id="agents-grid">
                                <!-- 动态加载坐席卡片 -->
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 通话监控 -->
                <div class="tab-pane fade" id="calls">
                    <div class="card">
                        <div class="card-header">
                            <h5><i class="fas fa-phone"></i> 实时通话监控</h5>
                        </div>
                        <div class="card-body">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>呼叫ID</th>
                                        <th>号码</th>
                                        <th>状态</th>
                                        <th>类型</th>
                                        <th>坐席</th>
                                        <th>持续时间</th>
                                        <th>操作</th>
                                    </tr>
                                </thead>
                                <tbody id="calls-table">
                                    <!-- 动态加载 -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- 报表分析 -->
                <div class="tab-pane fade" id="reports">
                    <div class="card">
                        <div class="card-header">
                            <h5><i class="fas fa-chart-bar"></i> 数据报表</h5>
                        </div>
                        <div class="card-body">
                            <div class="row mb-3">
                                <div class="col-md-3">
                                    <input type="date" class="form-control" id="report-start-date">
                                </div>
                                <div class="col-md-3">
                                    <input type="date" class="form-control" id="report-end-date">
                                </div>
                                <div class="col-md-3">
                                    <select class="form-control" id="report-type">
                                        <option value="daily">日报表</option>
                                        <option value="weekly">周报表</option>
                                        <option value="monthly">月报表</option>
                                    </select>
                                </div>
                                <div class="col-md-3">
                                    <button class="btn btn-primary" onclick="generateReport()">
                                        <i class="fas fa-sync"></i> 生成报表
                                    </button>
                                </div>
                            </div>
                            <div id="report-content">
                                <!-- 动态加载报表内容 -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 创建任务模态框 -->
        <div class="modal fade" id="createCampaignModal" tabindex="-1">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">创建外呼任务</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <form id="campaign-form">
                            <div class="mb-3">
                                <label class="form-label">任务名称</label>
                                <input type="text" class="form-control" id="campaign-name" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">任务描述</label>
                                <textarea class="form-control" id="campaign-description" rows="2"></textarea>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">开始时间</label>
                                    <input type="datetime-local" class="form-control" id="campaign-start-time" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">结束时间</label>
                                    <input type="datetime-local" class="form-control" id="campaign-end-time" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">话术脚本</label>
                                <textarea class="form-control" id="campaign-script" rows="4" 
                                    placeholder="输入机器人话术..."></textarea>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">号码列表</label>
                                <div class="input-group">
                                    <input type="file" class="form-control" id="phone-file" accept=".csv,.xlsx,.txt">
                                    <button class="btn btn-outline-secondary" type="button" onclick="showPhoneInput()">
                                        手动输入
                                    </button>
                                </div>
                                <textarea class="form-control mt-2 d-none" id="phone-list" rows="5" 
                                    placeholder="每行一个号码"></textarea>
                            </div>
                            <div class="row">
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">最大重试次数</label>
                                    <input type="number" class="form-control" id="max-retries" value="3" min="0" max="10">
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">重试间隔(分钟)</label>
                                    <input type="number" class="form-control" id="retry-interval" value="60" min="10">
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">优先级</label>
                                    <select class="form-control" id="campaign-priority">
                                        <option value="1">低</option>
                                        <option value="5" selected>中</option>
                                        <option value="10">高</option>
                                    </select>
                                </div>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                        <button type="button" class="btn btn-primary" onclick="createCampaign()">创建任务</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 坐席登录模态框 -->
        <div class="modal fade" id="agentLoginModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">坐席签入</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <form id="agent-login-form">
                            <div class="mb-3">
                                <label class="form-label">分机号</label>
                                <input type="text" class="form-control" id="agent-extension" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">密码</label>
                                <input type="password" class="form-control" id="agent-password" required>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                        <button type="button" class="btn btn-primary" onclick="agentLogin()">签入</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 底部脚本 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.7.0/dist/chart.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.5.0/dist/socket.io.min.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
