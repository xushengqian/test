<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>fs 实时音频流（PCM）</title>
    <style>
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji",
          "Segoe UI Emoji";
        margin: 32px;
        max-width: 900px;
        line-height: 1.5;
      }
      code,
      pre {
        background: #f6f8fa;
        padding: 2px 6px;
        border-radius: 6px;
      }
      .row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        align-items: center;
        margin: 16px 0;
      }
      button {
        padding: 10px 14px;
        border-radius: 10px;
        border: 1px solid #ddd;
        background: white;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .status {
        padding: 8px 12px;
        border: 1px solid #eee;
        border-radius: 10px;
        background: #fafafa;
        min-width: 280px;
      }
      .hint {
        color: #555;
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New",
          monospace;
      }
    </style>
  </head>
  <body>
    <h2>用 fs 获取“实时音频流”（读取正在增长的文件）</h2>
    <p class="hint">
      服务端通过 <code>fs.stat + fs.open/read</code> 轮询读取 <span class="mono">data/live.pcm</span> 新增字节，并用 WebSocket 推送到浏览器。
      前端用 Web Audio 的 AudioWorklet 实时播放（假设输入为 PCM s16le / 48kHz / 单声道）。
    </p>

    <div class="row">
      <button id="btnStart">开始播放</button>
      <button id="btnStop" disabled>停止</button>
      <div class="status mono" id="status">idle</div>
    </div>

    <div class="hint">
      <p>快速演示（另开一个终端运行写入器）：</p>
      <pre>npm run writer:sine</pre>
      <p>然后在这里点击“开始播放”。</p>
    </div>

    <script type="module">
      const statusEl = document.getElementById("status");
      const btnStart = document.getElementById("btnStart");
      const btnStop = document.getElementById("btnStop");

      let ws = null;
      let audioCtx = null;
      let node = null;
      let fmt = { sampleRate: 48000, channels: 1, type: "pcm_s16le" };

      function setStatus(s) {
        statusEl.textContent = s;
      }

      function getWsUrl() {
        const proto = location.protocol === "https:" ? "wss:" : "ws:";
        return `${proto}//${location.host}/ws`;
      }

      async function start() {
        btnStart.disabled = true;
        setStatus("初始化音频上下文...");

        audioCtx = new AudioContext();
        await audioCtx.audioWorklet.addModule("/pcm-player.worklet.js");

        node = new AudioWorkletNode(audioCtx, "pcm-player");
        node.connect(audioCtx.destination);

        setStatus("连接 WebSocket...");
        ws = new WebSocket(getWsUrl());
        ws.binaryType = "arraybuffer";

        ws.onopen = () => {
          setStatus("WebSocket 已连接，等待音频数据...");
        };
        ws.onclose = () => {
          setStatus("WebSocket 已关闭");
        };
        ws.onerror = () => {
          setStatus("WebSocket 错误");
        };
        ws.onmessage = (ev) => {
          if (typeof ev.data === "string") {
            try {
              const msg = JSON.parse(ev.data);
              if (msg?.type === "fmt") {
                fmt = msg;
                node.port.postMessage({ type: "fmt", fmt: msg, dstSampleRate: audioCtx.sampleRate });
                setStatus(
                  `已连接：src=${msg.sampleRate}Hz ch=${msg.channels} (${msg.type}) -> dst=${audioCtx.sampleRate}Hz`
                );
              }
            } catch {
              // ignore
            }
            return;
          }

          // binary PCM chunk
          node.port.postMessage({ type: "pcm", pcm: ev.data, srcSampleRate: fmt.sampleRate });
        };

        btnStop.disabled = false;
      }

      async function stop() {
        btnStop.disabled = true;
        btnStart.disabled = false;

        try {
          ws?.close();
        } catch {}
        ws = null;

        try {
          node?.disconnect();
        } catch {}
        node = null;

        try {
          await audioCtx?.close();
        } catch {}
        audioCtx = null;

        setStatus("stopped");
      }

      btnStart.addEventListener("click", () => start().catch((e) => setStatus(`启动失败: ${e?.message || e}`)));
      btnStop.addEventListener("click", () => stop());
    </script>
  </body>
</html>
