<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 智能外呼系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        
        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,.3);
            overflow: hidden;
            width: 900px;
            max-width: 90%;
        }
        
        .login-left {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 60px;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        .login-left h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            font-weight: bold;
        }
        
        .login-left p {
            font-size: 1.1rem;
            opacity: 0.9;
            text-align: center;
        }
        
        .login-left .features {
            margin-top: 40px;
        }
        
        .login-left .feature-item {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .login-left .feature-item i {
            font-size: 1.5rem;
            margin-right: 15px;
            opacity: 0.9;
        }
        
        .login-right {
            padding: 60px;
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .login-header h2 {
            color: #333;
            font-weight: 600;
            margin-bottom: 10px;
        }
        
        .login-header p {
            color: #666;
        }
        
        .form-control {
            border-radius: 10px;
            padding: 12px 20px;
            border: 1px solid #ddd;
            font-size: 1rem;
        }
        
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102,126,234,.25);
        }
        
        .input-group-text {
            background: transparent;
            border-radius: 10px 0 0 10px;
            border-right: none;
        }
        
        .input-group .form-control {
            border-radius: 0 10px 10px 0;
            border-left: none;
        }
        
        .btn-login {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: 500;
            width: 100%;
            transition: all 0.3s ease;
        }
        
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102,126,234,.3);
            color: white;
        }
        
        .login-type-tabs {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #f0f0f0;
        }
        
        .login-type-tab {
            padding: 10px 30px;
            cursor: pointer;
            color: #666;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
            transition: all 0.3s ease;
        }
        
        .login-type-tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }
        
        .alert {
            border-radius: 10px;
        }
        
        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .remember-forgot a {
            color: #667eea;
            text-decoration: none;
            font-size: 0.9rem;
        }
        
        .remember-forgot a:hover {
            text-decoration: underline;
        }
        
        @media (max-width: 768px) {
            .login-left {
                display: none;
            }
            
            .login-right {
                padding: 40px 30px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="row g-0 h-100">
            <div class="col-md-5 login-left">
                <i class="fas fa-phone-volume fa-4x mb-4"></i>
                <h1>智能外呼系统</h1>
                <p>高效、智能、人性化的呼叫中心解决方案</p>
                
                <div class="features">
                    <div class="feature-item">
                        <i class="fas fa-robot"></i>
                        <span>智能机器人对话</span>
                    </div>
                    <div class="feature-item">
                        <i class="fas fa-headset"></i>
                        <span>人工坐席无缝接入</span>
                    </div>
                    <div class="feature-item">
                        <i class="fas fa-chart-line"></i>
                        <span>实时数据分析</span>
                    </div>
                </div>
            </div>
            
            <div class="col-md-7 login-right">
                <div class="login-header">
                    <h2>欢迎登录</h2>
                    <p>请选择您的身份类型并登录系统</p>
                </div>
                
                <div class="login-type-tabs">
                    <div class="login-type-tab active" onclick="switchLoginType('admin')">
                        <i class="fas fa-user-shield"></i> 管理员
                    </div>
                    <div class="login-type-tab" onclick="switchLoginType('agent')">
                        <i class="fas fa-headset"></i> 坐席
                    </div>
                </div>
                
                <div id="login-alert" class="alert alert-danger d-none" role="alert">
                    <i class="fas fa-exclamation-circle"></i> <span id="alert-message"></span>
                </div>
                
                <form id="login-form" onsubmit="handleLogin(event)">
                    <div class="mb-3">
                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="fas fa-user"></i>
                            </span>
                            <input type="text" class="form-control" id="username" 
                                placeholder="请输入用户名" required>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="fas fa-lock"></i>
                            </span>
                            <input type="password" class="form-control" id="password" 
                                placeholder="请输入密码" required>
                        </div>
                    </div>
                    
                    <div class="remember-forgot">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="remember">
                            <label class="form-check-label" for="remember">
                                记住我
                            </label>
                        </div>
                        <a href="#">忘记密码？</a>
                    </div>
                    
                    <button type="submit" class="btn btn-login">
                        <i class="fas fa-sign-in-alt"></i> 立即登录
                    </button>
                </form>
                
                <div class="text-center mt-4">
                    <small class="text-muted">
                        推荐使用 Chrome、Firefox、Edge 等现代浏览器
                    </small>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        let loginType = 'admin';
        
        function switchLoginType(type) {
            loginType = type;
            
            // 更新选项卡状态
            document.querySelectorAll('.login-type-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.closest('.login-type-tab').classList.add('active');
            
            // 清空表单
            document.getElementById('login-form').reset();
            hideAlert();
        }
        
        async function handleLogin(event) {
            event.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember').checked;
            
            // 显示加载状态
            const submitBtn = event.target.querySelector('button[type="submit"]');
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 登录中...';
            submitBtn.disabled = true;
            
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username,
                        password,
                        type: loginType
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // 保存token
                    localStorage.setItem('authToken', data.token);
                    localStorage.setItem('userInfo', JSON.stringify(data.user));
                    
                    if (remember) {
                        localStorage.setItem('rememberedUser', username);
                    }
                    
                    // 跳转到主页
                    window.location.href = '/';
                } else {
                    showAlert(data.error || '登录失败，请检查用户名和密码');
                }
            } catch (error) {
                showAlert('网络错误，请稍后重试');
            } finally {
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            }
        }
        
        function showAlert(message) {
            const alertDiv = document.getElementById('login-alert');
            const alertMessage = document.getElementById('alert-message');
            
            alertMessage.textContent = message;
            alertDiv.classList.remove('d-none');
            
            setTimeout(() => {
                alertDiv.classList.add('d-none');
            }, 5000);
        }
        
        function hideAlert() {
            document.getElementById('login-alert').classList.add('d-none');
        }
        
        // 页面加载时检查记住的用户
        window.onload = function() {
            const rememberedUser = localStorage.getItem('rememberedUser');
            if (rememberedUser) {
                document.getElementById('username').value = rememberedUser;
                document.getElementById('remember').checked = true;
            }
            
            // 检查是否已登录
            const token = localStorage.getItem('authToken');
            if (token) {
                window.location.href = '/';
            }
        };
    </script>
</body>
</html>
