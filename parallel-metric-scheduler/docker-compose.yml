version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: metric_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: metric_scheduler
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/create_database.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./scripts/insert_test_data.sql:/docker-entrypoint-initdb.d/02-data.sql
    command: --default-authentication-plugin=mysql_native_password --max-connections=500
    networks:
      - metric_network

  redis:
    image: redis:7-alpine
    container_name: metric_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - metric_network

  scheduler:
    build: .
    container_name: metric_scheduler
    depends_on:
      - mysql
      - redis
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: root123
      MYSQL_DATABASE: metric_scheduler
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MAX_CONCURRENT_JOBS: 50
      EXECUTOR_WORKERS: 20
      JOB_SCAN_WORKERS: 4
      LOG_LEVEL: INFO
    volumes:
      - ./logs:/app/logs
    networks:
      - metric_network
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:

networks:
  metric_network:
    driver: bridge
