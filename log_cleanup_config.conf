# 日志清理配置文件
# 请根据您的实际需求修改以下配置

# 需要清理的日志目录列表（每行一个目录）
# 注意：系统目录需要sudo权限
LOG_DIRECTORIES=(
    "/var/log"           # 系统日志目录
    "/workspace/logs"    # 工作空间日志目录
    "/tmp/logs"          # 临时日志目录
    # 添加更多目录...
    # "/home/user/app/logs"
    # "/opt/application/logs"
)

# 需要清理的日志文件模式
LOG_PATTERNS=(
    "*.log"              # 标准日志文件
    "*.out"              # 输出文件
    "*.err"              # 错误文件
    "access_log*"        # Apache/Nginx访问日志
    "error_log*"         # Apache/Nginx错误日志
    # 添加更多模式...
    # "*.log.*"          # 轮转日志文件
    # "catalina.out"     # Tomcat日志
)

# 配置说明：
# 1. 修改LOG_DIRECTORIES数组来指定要清理的目录
# 2. 修改LOG_PATTERNS数组来指定要清理的文件模式
# 3. 脚本会保留文件但清空内容，不会删除文件
# 4. 清理操作会记录在 /workspace/log_cleanup.log 中